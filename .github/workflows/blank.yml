name: Encode Cookie to Base64

on:
  workflow_dispatch:
    inputs:
      cookie_content:
        description: 'محتوای کوکی (Netscape format)'
        required: true
        type: string

jobs:
  encode:
    runs-on: ubuntu-latest
    steps:
      - name: Encode cookie to base64
        run: |
          echo -n "${{ github.event.inputs.cookie_content }}" | base64 > encoded.txt
          echo "Base64 شده:"
          cat encoded.txt
      - name: Save as secret
        run: |
          ENCODED=$(cat encoded.txt)
          echo "COOKIE_BASE64=$ENCODED" >> $GITHUB_ENV
      - name: Show result
        run: |
          echo "مقدار Base64 کوکی:"
          echo "${{ env.COOKIE_BASE64 }}"
