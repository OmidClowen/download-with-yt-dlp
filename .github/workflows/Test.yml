name: yt-dlp Videos with sub and split into 90MB parts

on:
  workflow_dispatch:
    inputs:
      URL:
        description: '🔗 لینک ویدیو (یوتیوب یا سایر سایت‌های پشتیبانی شده)'
        required: true
        type: string
      PASSWORD:
        description: '🔐 رمز فایل فشرده (اختیاری)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  download-and-split:
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 دریافت کد مخزن (برنچ downloads)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: downloads
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ نصب ابزارها (Deno, yt-dlp, ffmpeg, 7z)
        run: |
          # به‌روزرسانی و نصب بسته‌های سیستمی
          sudo apt update
          sudo apt install -y ffmpeg p7zip-full python3-pip

          # نصب Deno (موتور جاوااسکریپت برای حل چالش یوتیوب)
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

          # نصب yt-dlp از طریق pip (همراه با تمام کامپوننت‌های جانبی)
          pip3 install --break-system-packages "yt-dlp[default]"

      - name: 🔧 تنظیمات گیت
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 📥 دانلود ویدیو با زیرنویس و متادیتا
        run: |
          # اگر کوکی در secrets ذخیره شده (اختیاری)
          if [ -n "${{ secrets.COOKIES }}" ]; then
            echo "${{ secrets.COOKIES }}" | base64 -d > cookies.txt
            COOKIE_OPT="--cookies cookies.txt"
          else
            COOKIE_OPT=""
          fi

          # دانلود با قابلیت حل چالش جاوااسکریپتی یوتیوب
          yt-dlp \
            --remote-components ejs:github \
            --write-sub \
            --sub-lang en \
            --embed-subs \
            --remux-video mkv \
            --embed-thumbnail \
            --embed-metadata \
            $COOKIE_OPT \
            --output "video_%(id)s.%(ext)s" \
            "${{ github.event.inputs.URL }}"

          rm -f cookies.txt

      - name: 🎯 پیدا کردن فایل دانلود شده
        id: findfile
        run: |
          FILE=$(ls -1 video_*.mkv 2>/dev/null | head -n1)
          if [ -z "$FILE" ]; then
            echo "❌ هیچ فایل MKV یافت نشد! دانلود احتمالاً ناموفق بوده."
            exit 1
          fi
          echo "file=$FILE" >> $GITHUB_OUTPUT
          echo "📁 فایل دانلود شده: $FILE"
          ls -lh "$FILE"

      - name: ✂️ تقسیم فایل به قطعات 90 مگابایتی (7z)
        run: |
          FILE="${{ steps.findfile.outputs.file }}"
          BASENAME="${FILE%.*}"
          FOLDER_NAME="${BASENAME}_split"
          mkdir -p "downloads/video/$FOLDER_NAME"

          if [ -z "${{ github.event.inputs.PASSWORD }}" ]; then
            7z a -mhe=on -mx=3 -v90m "downloads/video/$FOLDER_NAME/archive.7z" "$FILE"
          else
            7z a -p"${{ github.event.inputs.PASSWORD }}" -mhe=on -mx=3 -v90m "downloads/video/$FOLDER_NAME/archive.7z" "$FILE"
          fi

          # حذف فایل اصلی
          rm -f "$FILE"

          echo "✅ آرشیو تقسیم شده در: downloads/video/$FOLDER_NAME"
          ls -lh "downloads/video/$FOLDER_NAME/"

      - name: 📤 ارسال به مخزن (برنچ downloads)
        run: |
          git add downloads/
          git commit -m "Add split video from ${{ github.event.inputs.URL }}" || echo "📭 تغییری برای commit وجود ندارد"
          git push -u origin downloads
